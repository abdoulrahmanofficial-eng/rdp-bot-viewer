<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDP Message Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rdp-container">
        <header class="rdp-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">🖥️</div>
                    <div class="title-section">
                        <h1>RDP MESSAGE VIEWER</h1>
                        <p class="subtitle">Telegram Bot Messages Dashboard</p>
                    </div>
                </div>
                <div class="connection-status">
                    <span class="status-dot online"></span>
                    <span class="status-text">CONNECTED</span>
                </div>
            </div>
        </header>

        <main class="rdp-main">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button id="refreshBtn" class="rdp-btn">
                        <span>🔄</span> Refresh
                    </button>
                    <button id="clearAllBtn" class="rdp-btn danger">
                        <span>🗑️</span> Clear All
                    </button>
                </div>
                <div class="toolbar-right">
                    <label class="auto-refresh-toggle">
                        <input type="checkbox" id="autoRefresh" checked>
                        <span class="toggle-slider"></span>
                        <span>Auto-refresh</span>
                    </label>
                    <div class="stats">
                        <span class="stat-item">
                            <span class="stat-label">Messages:</span>
                            <span class="stat-value" id="totalMessages">0</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="messages-panel">
                <div class="panel-header">
                    <h2>📨 Messages</h2>
                    <div class="panel-actions">
                        <button id="deleteSelectedBtn" class="rdp-btn small danger" style="display: none;">
                            🗑️ Delete Selected
                        </button>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>Loading messages...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="rdp-footer">
            <p>© 2024 RDP Message Viewer | Powered by Cloudflare Workers</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
